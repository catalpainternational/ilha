[project]
name = "ilha"
version = "0.9.8"
description = "Git worktrees with isolated Docker Compose environments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0.0",
    "docker>=6.0.0",
    "requests>=2.31.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "tldextract>=5.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.4.0",
    "pymdown-extensions>=10.0",
]

[project.scripts]
ilha = "ilha.cli:main"


[project.urls]
Homepage = "https://github.com/catalpainternational/ilha"
Documentation = "https://catalpainternational.github.io/ilha"
Repository = "https://github.com/catalpainternational/ilha"
Issues = "https://github.com/catalpainternational/ilha/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ilha"]
include = [
    "ilha/completions/*",
    "ilha/config/*",
    "ilha/scripts/*"
]
