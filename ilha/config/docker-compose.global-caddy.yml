# Global Caddy Proxy for ilha
# This file defines only the global Caddy proxy container
# Used by: ilha start/stop commands

services:
  # Docker socket proxy — exposes only read-only container/network APIs.
  # caddy-monitor talks to this instead of mounting the raw Docker socket.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: ilha_docker_socket_proxy
    environment:
      CONTAINERS: 1
      NETWORKS: 1
      EVENTS: 1
      # Everything else defaults to 0 (denied)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - ilha_caddy_proxy
    restart: unless-stopped

  caddy:
    image: caddy:2
    container_name: ilha_caddy_proxy
    ports:
      - "80:80"
      - "443:443"
      # Admin API (:2019) is intentionally NOT published. It is bound to the
      # container loopback (Caddyfile: admin localhost:2019) and reached only by
      # caddy-monitor, which shares this container's network namespace. This keeps
      # the unauthenticated admin API off both the internet AND the shared proxy
      # network (untrusted app containers). Manual host debugging:
      #   docker exec ilha_caddy_proxy wget -qO- http://127.0.0.1:2019/config/
    environment:
      CADDY_EMAIL: ${CADDY_EMAIL:-admin@example.com}
    volumes:
      # Caddy needs the Docker socket for its built-in Docker integration.
      # This is read-only but still grants broad Docker API access to the Caddy container.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - caddy_data:/data
      - caddy_config:/config
      - {CADDYFILE_PATH}:/etc/caddy/Caddyfile
    networks:
      - ilha_caddy_proxy

  caddy-monitor:
    image: python:3.11-slim
    container_name: caddy_monitor
    # Share Caddy's network namespace so the monitor reaches the loopback-bound
    # admin API at 127.0.0.1:2019 — no admin port is exposed on the proxy network.
    # (network_mode is mutually exclusive with `networks:`; DNS for
    # docker-socket-proxy still resolves via Caddy's ilha_caddy_proxy membership.)
    network_mode: "service:caddy"
    environment:
      USE_STAGING_CERTIFICATES: ${USE_STAGING_CERTIFICATES:-}
      # Connect to Docker via the socket proxy, not the raw socket
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      # Reach Caddy's loopback admin API (shared netns).
      CADDY_ADMIN_URL: http://127.0.0.1:2019
    volumes:
      - {MONITOR_SCRIPT_PATH}:/app/monitor.py
      - {HELPER_UTILS_PATH}:/app/caddy_admin_utils.py
      - {ROUTING_MODULE_PATH}:/app/caddy_routing.py
    command: ["sh", "-c", "pip install --no-cache-dir docker==7.1.0 requests==2.32.3 && python /app/monitor.py"]
    depends_on:
      - caddy
      - docker-socket-proxy
    restart: unless-stopped

volumes:
  caddy_data:
    name: ilha_caddy_data
    external: true
  caddy_config:
    name: ilha_caddy_config
    external: true

networks:
  ilha_caddy_proxy:
    external: true
