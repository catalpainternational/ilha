[pytest]
testpaths = tests
# Default run: unit tests only. Opt in to integration/e2e with `-m integration` or `-m e2e`.
addopts = -v --tb=short -m "not integration and not e2e"
markers =
    unit
    integration: requires a real environment (docker, filesystem, interactive input) — opt in with `-m integration`
    e2e: end-to-end workflow tests — opt in with `-m e2e`
    slow
    docker
    setup
    config
    install
    error
norecursedirs = worktrees

